[project]
name = "ratchet"
version = "0.1.0"
description = "Derive eval cases from the complaints and fixes a team already produces, then score every change per case."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ratchet = "ratchet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratchet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
